<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.P.A.R.K. AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(to bottom right, rgba(72, 72, 72, 0.4), rgba(208, 208, 208, 0.3)), url('backgrosu.jpg');
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        html {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Видео растягивается, чтобы заполнить весь экран */
            z-index: -1; /* Видео будет на заднем фоне */
            filter: blur(5px); /* Применяем размытие */
        }

        .container {
            display: flex;
            justify-content: space-between;
            width: 90%;
            height: 90%;
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            background-color: rgba(4, 7, 10, 0.55);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.125);
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .features {
            width: 60%;
            position: relative;
            display: flex;
            filter: grayscale(0.34) saturate(0.85) opacity(0.9);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            border-radius: 20px;
            animation: slideShow 20s infinite;
            backdrop-filter: blur(200px) saturate(180%);
            box-shadow: 15px 14px 58px -3px rgba(23,23,23,1);
            -webkit-box-shadow: 15px 14px 58px -3px rgba(23,23,23,1);
            -moz-box-shadow: 15px 14px 58px -3px rgba(23,23,23,1);
        }

        @keyframes slideShow {
            0%, 100% { background-image: url('conversation-example.png'); }  /* Первое изображение: 10 секунд */
            79.99%, 90% { background-image: url('compare-example.png'); }/* Третье изображение: 10 секунд */
        }

        .features h2 {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 42px;
            font-family: "Advent Pro", system-ui;
            font-optical-sizing: auto;
            font-weight: bold;
            font-style: normal;
            letter-spacing: 1px;
            font-variation-settings: "wdth" 130.1;
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            background-color: rgba(17, 25, 40, 0.75);
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.125);
            border-radius: 14px;
        }

        .auth-menu {
            width: 35%;
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            background-color: rgba(17, 25, 40, 0.75);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.125);
            animation: fadeIn 1s ease;
            box-shadow: 15px 14px 58px -3px rgba(23,23,23,1);
            -webkit-box-shadow: 15px 14px 58px -3px rgba(23,23,23,1);
            -moz-box-shadow: 15px 14px 58px -3px rgba(23,23,23,1);
        }

        .auth-menu h1 {
            color: white;
            margin-top: 50%;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .auth-menu button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            font-size: 18px;
            color: white;
            cursor: pointer;
            background: rgba(218, 218, 218, 0.2);
            border: 1px solid #ccc;
            transition: all 0.3s ease;
        }

        .auth-menu button:hover {
            background: rgba(218, 218, 218, 0.8);
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: row;
            }

            .features {
                display: none;
            }

            .auth-menu {
                width: 100%;
            }

            .features h2 {
                font-size: 42px;
            }

            .auth-menu h1 {
                font-size: 36px;
            }

            .auth-menu button {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
<video class="video-background" autoplay muted loop>
    <source src="your-video.mp4" type="video/mp4">
    Ваш браузер не поддерживает видео.
</video>

<div class="container">
    <!-- Левая часть с возможностями ИИ -->
    <div class="features">
        <h2>S.P.A.R.K. AI</h2>
        <!-- Слайдшоу функциональности -->
    </div>

    <!-- Правая часть: выбор "Регистрация / Войти" -->
    <div class="auth-menu">
        <h1>Добро пожаловать</h1>
        <button onclick="register()">Регистрация</button>
        <button onclick="login()">Войти</button>
    </div>
</div>

<script>

    function register (){
        window.location.href = '/reg';
    }

    function login (){
        window.location.href = '/login';
    }

</script>

</body>
</html>
