<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация S.P.A.R.K. AI</title>
    <link rel="stylesheet" href="reg-styles.css">
</head>
<body>
<div class="container">
    <!-- Этап регистрации в контейнере с анимацией переворота карточки -->
    <div class="question-box" id="step-container">
        <!-- Этап 1: Ввод электронной почты и проверка кода -->
        <div id="step-1">
            <div class="question-content">
                <h2>Вход</h2>
                <label for="email">Введите вашу почту:</label>
                <input type="email" id="email" placeholder="example@mail.com" class="input-field">
                <label for="password">Введите ваш пароль:</label>
                <input type="text" id="password" placeholder="ваш пароль" class="input-field">
                <button id="login-button" class="button" onclick="submitLogin()">Войти</button>
            </div>
        </div>
    </div>
</div>
<video class="video-background" autoplay muted loop>
    <source src="your-video.mp4" type="video/mp4">
    Ваш браузер не поддерживает видео.
</video>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io('http://localhost:1000/', { transports: ['websocket'], upgrade: false });
    // Отправка данных после регистрации и завершения теста
    function setButtonSuccess(button, success) {
        button.classList.remove('loading');
        if (success) {
            button.classList.add('success');
        } else {
            button.classList.add('error');
        }
        setTimeout(() => {
            button.classList.remove('success', 'error');
            button.disabled = false;
        }, 1500);
    }

    function setLoadingState(button, isLoading) {
        if (isLoading) {
            button.classList.add('loading');
            button.disabled = true;
        } else {
            button.classList.remove('loading');
            button.disabled = false;
        }
    }

    function submitLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const button = document.getElementById('login-button');
        setLoadingState(button, true);

        // Отправляем данные на сервер
        socket.emit('login-data', {
            username: email,
            password: password
        });
    }

    socket.on('successful-login', (data) => {
        localStorage.setItem("userData", JSON.stringify(data));
        window.location.href = '/';
    });
    socket.on('login-error', () => {
        const button = document.getElementById('login-button');
        setLoadingState(button, false);
        setButtonSuccess(button, false);
    });
</script>
</body>
</html>
